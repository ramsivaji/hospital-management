openapi: 3.0.3
info:
  title: Clinic Booking API
  version: 1.0.0
  description: API for the clinic appointment booking system.
paths:
  /api/internal/send-reminders/:
    post:
      operationId: internal_send_reminders_create
      tags:
      - internal
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/admin/specialties/:
    get:
      operationId: v1_admin_specialties_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSpecialtyList'
          description: ''
    post:
      operationId: v1_admin_specialties_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Specialty'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Specialty'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Specialty'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specialty'
          description: ''
  /api/v1/admin/specialties/{id}/:
    get:
      operationId: v1_admin_specialties_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specialty'
          description: ''
    put:
      operationId: v1_admin_specialties_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Specialty'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Specialty'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Specialty'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specialty'
          description: ''
    patch:
      operationId: v1_admin_specialties_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSpecialty'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSpecialty'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSpecialty'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specialty'
          description: ''
    delete:
      operationId: v1_admin_specialties_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/appointments:
    get:
      operationId: v1_appointments_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_appointments_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/appointments/{id}:
    get:
      operationId: v1_appointments_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/appointments/{id}/{action}:
    post:
      operationId: v1_appointments_create_2
      parameters:
      - in: path
        name: action
        schema:
          type: string
          pattern: ^cancel|reschedule|complete|no-show$
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/dashboard/admin/:
    get:
      operationId: v1_dashboard_admin_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/dashboard/doctor/:
    get:
      operationId: v1_dashboard_doctor_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/dashboard/patient/:
    get:
      operationId: v1_dashboard_patient_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/doctors/:
    get:
      operationId: v1_doctors_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoctorProfileList'
          description: ''
  /api/v1/doctors/{id}/availability/:
    get:
      operationId: v1_doctors_availability_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWeeklyAvailabilityList'
          description: ''
    post:
      operationId: v1_doctors_availability_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyAvailability'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WeeklyAvailability'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WeeklyAvailability'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyAvailability'
          description: ''
  /api/v1/doctors/{id}/slots/:
    get:
      operationId: v1_doctors_slots_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/doctors/{id}/time-off/:
    get:
      operationId: v1_doctors_time_off_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTimeOffList'
          description: ''
    post:
      operationId: v1_doctors_time_off_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeOff'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TimeOff'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TimeOff'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOff'
          description: ''
  /api/v1/doctors/{id}/:
    get:
      operationId: v1_doctors_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDetail'
          description: ''
  /api/v1/reports/appointments.csv/:
    get:
      operationId: v1_reports_appointments.csv_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    DoctorDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSimple'
          readOnly: true
        specialty:
          allOf:
          - $ref: '#/components/schemas/Specialty'
          readOnly: true
        bio:
          type: string
        slot_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        buffer_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - specialty
      - user
    DoctorProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSimple'
          readOnly: true
        specialty:
          allOf:
          - $ref: '#/components/schemas/Specialty'
          readOnly: true
        bio:
          type: string
        slot_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        buffer_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - specialty
      - user
    PaginatedDoctorProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/DoctorProfile'
    PaginatedSpecialtyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Specialty'
    PaginatedTimeOffList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/TimeOff'
    PaginatedWeeklyAvailabilityList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyAvailability'
    PatchedSpecialty:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 8
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: patient
      required:
      - email
      - name
      - password
    RoleEnum:
      enum:
      - patient
      - doctor
      - receptionist
      - admin
      type: string
      description: |-
        * `patient` - Patient
        * `doctor` - Doctor
        * `receptionist` - Receptionist
        * `admin` - Admin
    Specialty:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    TimeOff:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        doctor_id:
          type: integer
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 200
      required:
      - doctor_id
      - end_at
      - id
      - start_at
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          readOnly: true
      required:
      - email
      - id
      - is_active
      - name
    UserSimple:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
      required:
      - email
      - id
      - name
    WeeklyAvailability:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        doctor_id:
          type: integer
          readOnly: true
        weekday:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 0=Monday, 6=Sunday
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - doctor_id
      - end_time
      - id
      - start_time
      - weekday
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
